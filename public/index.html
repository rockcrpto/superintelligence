<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superintelligence</title>
<style>
:root{
  --bg:#040406; --ice:#f2f3f5; --muted:#8b8fa3; --line:rgba(255,255,255,.09);
  --glow:#7c8cff;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:
    radial-gradient(ellipse 60% 45% at 50% 0%, rgba(124,140,255,.16), transparent 65%), var(--bg);
  color:var(--ice); font-family:'Inter',system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 24px; text-align:center;
}
.mark{
  width:64px; height:64px; margin-bottom:34px; opacity:.92;
}
.eyebrow{
  font-size:.76rem; letter-spacing:.28em; text-transform:uppercase; color:var(--muted);
  margin-bottom:22px; font-weight:600;
}
h1{
  font-size:clamp(2.4rem,7vw,4.4rem); font-weight:700; letter-spacing:-.02em; margin:0 0 22px;
  line-height:1.05;
}
p.lede{
  max-width:560px; color:var(--muted); font-size:1.05rem; line-height:1.75; margin:0 0 46px;
  font-weight:400;
}
.contact-row{
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:44px;
}
.contact-card{
  display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px;
  padding:13px 22px; color:var(--ice); text-decoration:none; font-size:.92rem; font-weight:600;
  background:rgba(255,255,255,.02); transition:border-color .15s, background .15s;
}
.contact-card:hover{border-color:var(--glow); background:rgba(124,140,255,.07);}
.contact-card svg{width:17px; height:17px; flex-shrink:0;}
footer{color:var(--muted); font-size:.75rem; letter-spacing:.02em;}
</style>
</head>
<body>

<svg class="mark" viewBox="0 0 64 64" fill="none">
  <circle cx="32" cy="32" r="30" stroke="#7c8cff" stroke-width="1.4" opacity=".5"/>
  <circle cx="32" cy="32" r="21" stroke="#f2f3f5" stroke-width="1.2" opacity=".35"/>
  <circle cx="32" cy="32" r="6" fill="#7c8cff"/>
</svg>

<div class="eyebrow">A Working Concept</div>
<h1>Superintelligence</h1>
<p class="lede">
  A quiet space to explore what comes after AGI — systems that don't just match human
  intelligence, but exceed it across every domain. Early stage. Still being shaped.
</p>

<div class="contact-row">
  <a class="contact-card" href="https://x.com/Rock_crpto" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.2l-5.6-7.3L4 22H1l8.1-9.3L0.9 2h7.4l5.1 6.7L18.9 2Zm-1.3 18h2L6.5 4H4.4l13.2 16Z"/></svg>
    @Rock_crpto
  </a>
  <a class="contact-card" href="mailto:rockcrpto@gmail.com">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
    rockcrpto@gmail.com
  </a>
</div>

<footer>superintelligence.qpon</footer>

</body>
</html>
